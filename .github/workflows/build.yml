name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build, check and package
        shell: pwsh
        run: |
          ./scripts/prepare-installer.ps1
          ./build.ps1 -Check -Installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Moru-win-x64
          path: |
            artifacts/Moru-win-x64.zip
            artifacts/Moru-Setup-*-win-x64.exe
          compression-level: 0
          retention-days: 7
